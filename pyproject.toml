[project]
name = "bbbc021-profiling"
version = "0.1.0"
description = "Image-based morphological profiling of MCF-7 cells (BBBC021)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.1.1",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "tifffile==2026.3.3",
]

[project.scripts]
bbbc021 = "bbbc021_profiling.cli:main"

[project.optional-dependencies]
segmentation = [
    "cellpose==3.0.9",
    "stardist==0.9.2",
    "tensorflow-cpu==2.21.0",
    "torch==2.15.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbbc021_profiling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
